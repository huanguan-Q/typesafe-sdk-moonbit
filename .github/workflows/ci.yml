name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: check / test / build / prove
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install Z3 prover backend
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3

      - name: Show toolchain versions
        run: |
          moon version --all
          z3 --version

      - name: moon check (wasm + js targets)
        run: |
          moon check
          moon check --target js

      - name: moon test
        run: moon test

      - name: moon build (wasm + js targets)
        run: |
          moon build
          moon build --target js

      - name: moon prove (Why3 + Z3, verified decision cores)
        run: moon prove
