name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: check / test / build / prove
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install Z3 prover backend
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3

      - name: Show toolchain versions
        run: |
          moon version --all
          z3 --version

      - name: moon check (wasm + js targets)
        run: |
          moon check
          moon check --target js

      - name: moon test
        run: moon test

      - name: Coverage gate (library packages, floor 85%)
        run: |
          moon test --enable-coverage
          moon coverage report -f summary | tee coverage.txt
          python3 -c "
          import sys
          hit = total = 0
          for ln in open('coverage.txt'):
              name, _, frac = ln.strip().rpartition(': ')
              if not frac or name == 'Total' or name.startswith('cmd/'):
                  continue
              try:
                  a, b = frac.split('/')
                  hit += int(a)
                  total += int(b)
              except ValueError:
                  pass
          pct = 100.0 * hit / total if total else 0.0
          print(f'library coverage: {hit}/{total} = {pct:.1f}% (floor 85%)')
          sys.exit(0 if pct >= 85.0 else 1)
          "

      - name: moon build (wasm + js targets)
        run: |
          moon build
          moon build --target js

      - name: moon prove (Why3 + Z3, verified decision cores)
        run: moon prove
